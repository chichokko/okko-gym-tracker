<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OKKO | Gym Tracker</title>
  <link rel="icon" id="favicon" href="/okko_square.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/okko_square.svg">
  <script>
    (function () {
      var favicon = document.getElementById('favicon');
      if (!favicon) return;
      function updateFavicon() {
        var isDark = document.documentElement.classList.contains('dark');
        favicon.href = isDark ? '/dark_okko_square.svg' : '/okko_square.svg';
      }
      var observer = new MutationObserver(updateFavicon);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      updateFavicon();
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbar for clean mobile UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script type="importmap">

    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">

</body>

</html>
